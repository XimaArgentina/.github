name: Sync labels

# Las labels son código: la fuente de verdad es .github/labels.json.
# Editar labels a mano en la UI de un repo se revierte en el próximo run.
#
# Corre en runner hosteado: este repo es público y Actions es gratis e ilimitado
# para repos públicos, así que no toca el presupuesto de minutos de la org. Los
# runners self-hosted quedan para los repos privados de producto.

on:
  push:
    branches: [main]
    paths:
      # A propósito NO incluye este archivo: si se dispara al editarse a sí mismo,
      # cada retoque del workflow ejecuta una sincronización que nadie pidió.
      - '.github/labels.json'
      - '.github/scripts/sync-labels.sh'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Repos separados por espacio (vacío = todos los de la org)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: sync-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync
        env:
          # Reusa el MISMO PAT que el tablero (scope `repo` + `project`): las labels
          # viven en todos los repos de la org, así que el GITHUB_TOKEN del repo no
          # alcanza (403). Un solo secreto para toda la automatización, no dos.
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::Falta el secret PROJECTS_TOKEN — no puedo tocar labels. Salgo sin hacer nada."
            exit 0
          fi
          chmod +x .github/scripts/sync-labels.sh
          .github/scripts/sync-labels.sh ${{ inputs.repos }}
